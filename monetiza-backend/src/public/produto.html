<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos - Monetiza</title>
    <link rel="icon" type="image/png" href="image/logo_monetiza.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/produto.css">
</head>
<body>

    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-area">
                <img src="image/icon_monetiza.png" alt="Logo" class="logo-sidebar">
                <span class="brand-name">Monetiza</span>
            </div>

            <nav class="menu-nav">
                <ul>
                    <li><a id="dashboard" href="dashboard"><i class="fa-solid fa-chart-pie"></i> Dashboard</a></li>
                    <li class="active"><a id="produto" href="landing"><i class="fa-solid fa-bag-shopping"></i> Produtos</a></li>
                    <li><a id="minhasVendas" href="minhasVendas"><i class="fa-solid fa-chart-line"></i> Minhas Vendas</a></li>
                    <li><a id="afiliados" href="afiliados"><i class="fa-solid fa-users"></i> Afiliados</a></li>
                    <li><a id="financeiro" href="financeiro"><i class="fa-solid fa-wallet"></i> Financeiro</a></li>
                    <li><a id="contratos" href="contratos"><i class="fa-solid fa-file-contract"></i> Contratos</a></li>
                    <li><a id="mensagens" href="mensagens"><i class="fa-solid fa-comment-dots"></i> Mensagens</a></li>
                    <li><a id="configuracoes" href="configuracoes"><i class="fa-solid fa-gear"></i> Configurações</a></li>
                </ul>
            </nav>

            <div class="user-profile">
                <div class="avatar-fallback"><i class="fa-solid fa-circle-user"></i></div>
                <div class="user-info">
                    <span id="nome-usuario" class="user-name">Carregando...</span>
                    <span id="email-usuario" class="user-email">...</span>
                </div>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <!-- Barra Superior -->
            <div class="top-bar">
                <span class="page-title">Produtos</span>
                <div class="top-bar-right">
                    <a href="#" class="vitrine-link">Ver Vitrine <i class="fa-solid fa-arrow-right"></i></a>
                    <div class="icon-group">
                        <div class="notification-dot-container">
                            <i class="fa-regular fa-bell"></i>
                            <span class="notification-dot"></span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cabeçalho de Produtos -->
            <div class="header-action-row">
                <div class="page-header-text">
                    <h2>Meus Produtos</h2>
                    <p>Gerencie seus produtos digitais</p>
                </div>
                <button class="btn-primary" id="btn-novo-produto">
                    <i class="fa-solid fa-plus"></i> Novo Produto
                </button>
            </div>

            <!-- Campo de Busca -->
            <div class="search-container">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" placeholder="Buscar produtos..." class="search-input">
            </div>

            <!-- Estado Vazio (Nenhum produto cadastrado) -->
            <div class="empty-state-card">
                <div class="empty-state-content">
                    <h3>Nenhum produto ainda</h3>
                    <p>Crie seu primeiro produto digital</p>
                    <button class="btn-primary btn-large">
                        <i class="fa-solid fa-plus"></i> Criar Produto
                    </button>
                </div>
            </div>
        </main>
    </div>

    <script src="js/produto.js"></script>
</body>
</html>
