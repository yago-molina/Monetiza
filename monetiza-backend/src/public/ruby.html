<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Ruby — Assistente Monetiza</title>

    <link
        rel="icon"
        type="image/png"
        href="/image/ruby-logo.png"
    >

    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
    >

    <link rel="stylesheet" href="/css/ruby.css">
    <link rel="stylesheet" href="/css/feedback.css">
</head>

<body>
    <main class="chat-main">
        <header class="chat-header">
            <button
                id="ruby-fechar"
                class="back-btn"
                type="button"
                aria-label="Fechar conversa"
            >
                &#8592;
            </button>

            <div class="avatar-container">
                <img
                    src="/image/ruby-logo.png"
                    alt="Ruby"
                >
            </div>

            <div class="header-info">
                <h1>RUBY</h1>

                <span id="ruby-estado" role="status">
                    Assistente da Monetiza
                </span>
            </div>

            <button
                id="ruby-nova-conversa"
                type="button"
                class="tools-btn"
                title="Nova conversa"
                aria-label="Nova conversa"
                disabled
            >
                ↺
            </button>
        </header>

        <div
            id="ruby-mensagens"
            class="chat-body"
            role="log"
            aria-live="polite"
            aria-label="Conversa com a Ruby"
        ></div>

        <div class="ruby-feedback">
            <p id="ruby-aviso" role="alert"></p>

            <a
                id="ruby-login"
                href="/login"
                target="_top"
                hidden
            >
                Entrar na Monetiza
            </a>
        </div>

        <form id="ruby-form" class="chat-footer">
            <div class="input-container">
                <input
                    id="ruby-mensagem"
                    type="text"
                    placeholder="Escreva uma mensagem..."
                    aria-label="Mensagem para a Ruby"
                    maxlength="2000"
                    autocomplete="off"
                    required
                    disabled
                >
            </div>

            <button
                id="ruby-enviar"
                class="send-btn"
                type="submit"
                aria-label="Enviar mensagem"
                disabled
            >
                ➔
            </button>
        </form>
    </main>

    <script src="/js/feedback.js"></script>
    <script src="/js/ruby.js"></script>
</body>
</html>
