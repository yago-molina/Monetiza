<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="landing.tituloDocumento">Dashboard - Monetiza</title>
    <link rel="icon" type="image/png" href="image/logo_monetiza.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="css/ruby.css">
    <link rel="stylesheet" href="css/notificacoes.css">
    <link rel="stylesheet" href="css/feedback.css">
    <script src="js/theme.js"></script>
</head>
<body>
    <!-- ÁREA PRINCIPAL DO CHAT (Apenas o banner e o chat da Ruby) -->
    <main class="chat-main">
        
        <!-- CABEÇALHO VERMELHO DA RUBY -->
        <header class="chat-header">
            <button class="back-btn" aria-label="Voltar" onclick="window.history.back()">&#8592;</button>
            <div class="avatar-container">
                <img src="image/ruby-logo.png" alt="Ruby Logo">
                <span class="status-dot"></span>
            </div>
            <div class="header-info">
                <h1>RUBY</h1>
                <span>Online agora</span>
            </div>
        </header>

        <!-- CORPO DO CHAT -->
        <div class="chat-body">
            <div class="message-wrapper">
                <div class="message-bubble">
                    <p>Olá! 😊</p>
                    <p>Seja bem-vindo(a). Estou aqui para ajudar você com suas dúvidas.</p>
                    <p>Pode me contar o que você precisa ou qual informação procura? Farei o possível para te ajudar rapidamente!</p>
                </div>
            </div>
        </div>

        <!-- RODAPÉ DE INPUT -->
        <footer class="chat-footer">
            <button class="tools-btn" title="Teclado / Opções">⌨️</button>
            <div class="input-container">
                <input type="text" placeholder="Escreva uma mensagem..." autocomplete="off">
            </div>
            <button class="send-btn" aria-label="Enviar mensagem">➔</button>
        </footer>

    </main>

    <script src="js/feedback.js"></script>
    <script src="js/perfil-global.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/ruby.js"></script>
    <script src="js/notificacoes.js"></script>
</body>
</html>
