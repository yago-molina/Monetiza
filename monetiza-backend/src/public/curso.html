<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Curso — Monetiza</title>
    <link rel="icon" type="image/png" href="/image/logo_monetiza.png">
    <script src="/js/i18n.js"></script>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/curso.css">
</head>
<body class="pagina-curso">
<main id="curso-app">
    <header class="curso-topo">
        <a class="curso-marca" href="/landing"><img src="/image/icon_monetiza.png" alt=""><span>Monetiza</span></a>
        <nav class="curso-nav">
            <a href="/produto" data-ct="products"></a>
            <a href="/minhasCompras" data-ct="purchases"></a>
        </nav>
        <div class="curso-preferencias">
            <label><span class="sr-only" data-ct="language"></span><select id="idioma"><option value="pt-BR">Português</option><option value="en">English</option><option value="es">Español</option></select></label>
            <button type="button" data-tema-select="light" data-ct="light"></button>
            <button type="button" data-tema-select="dark" data-ct="dark"></button>
        </div>
    </header>
    <div class="curso-barra-produtor" id="barra-produtor" hidden>
        <span id="estado-edicao"></span>
        <button id="abrir-editor" type="button" data-ct="editor"></button>
        <button id="ver-previa" type="button" data-ct="preview"></button>
    </div>
    <p id="aviso" role="status" aria-live="polite"></p>
    <div id="faixa-previa" hidden><span data-ct="previewNote"></span><button id="voltar-editor" type="button" data-ct="back"></button></div>
    <section id="editor" hidden>
        <div class="editor-titulo"><h1 data-ct="editor"></h1><button id="salvar" class="botao-principal" type="button" data-ct="save"></button></div>
        <p data-ct="limits"></p><p data-ct="uploadHint"></p>
        <div class="editor-campos">
            <label><span data-ct="title"></span><input id="editar-titulo" maxlength="100" required></label>
            <label><span data-ct="price"></span><input id="editar-preco" type="number" min="0.01" max="999999.99" step="0.01"></label>
            <label><span data-ct="commission"></span><input id="editar-comissao" type="number" min="0" max="100" step="0.01"></label>
            <label><span data-ct="color"></span><input id="editar-cor" type="color"></label>
            <label><span data-ct="cover"></span><input id="editar-capa" type="file" accept="image/png,image/jpeg,image/webp"></label>
            <label><span data-ct="publication"></span><select id="editar-status"><option value="Rascunho" data-ct="draft"></option><option value="Ativo" data-ct="published"></option><option value="Inativo" data-ct="inactive"></option></select></label>
        </div>
        <label><span data-ct="intro"></span><textarea id="editar-apresentacao" maxlength="10000" rows="4"></textarea></label>
        <div id="modulos-editor"></div><button id="adicionar-modulo" type="button" data-ct="addModule"></button>
    </section>
    <div id="visao-aluno" hidden>
        <header id="cabecalho" class="curso-hero">
            <div><span class="sobretitulo" data-ct="learning"></span><h1 id="titulo"></h1><p id="apresentacao"></p><p id="progresso"></p><progress id="barra-progresso" max="100" value="0"></progress></div>
            <img id="capa" alt="">
        </header>
        <section class="curso-modulos"><h2 data-ct="modules"></h2><div id="cards-modulos"></div></section>
        <section id="area-aluno">
            <div class="curso-player">
                <div id="player-vazio"><span aria-hidden="true">▷</span><h2 data-ct="choose"></h2><p data-ct="chooseHint"></p></div>
                <video id="video" controls playsinline preload="metadata" hidden></video>
                <div class="player-informacoes"><span id="modulo-atual" class="sobretitulo"></span><h2 id="aula-titulo"></h2><p id="video-aviso" role="status"></p>
                    <div class="player-acoes"><a id="material" hidden data-ct="download"></a><label id="conclusao" hidden><input id="concluida" type="checkbox"><span data-ct="mark"></span></label></div>
                </div>
            </div>
            <aside class="curso-conteudo"><h2 data-ct="curriculum"></h2><div id="aulas"></div></aside>
        </section>
    </div>
</main>
<script src="/js/curso-i18n.js"></script>
<script src="/js/curso.js"></script>
</body>
</html>
